[package]
name = "aphorme"
version = "0.1.20"
edition = "2021"
description = "A program launcher for X11 and Wayland"
license = "GPL-3.0"
keywords = ["program-launcher", "linux-utility"]
repository = "https://github.com/Iaphetes/aphorme_launcher"
homepage = "https://github.com/Iaphetes/aphorme_launcher"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = {version = "0.33"}
egui_extras = {version = "0.33", features = ["all_loaders", "image", "svg"]}
freedesktop_entry_parser = "2.0"
fuzzy-matcher = "0.3"
linicon = "2.3"
linicon-theme = "1.2"
image = { version = "0.25.0", features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
confy = "2.0"
dirs = "6"
single-instance = "0.3"
once_cell = "1.19.0"
env_logger = "0.11.3"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
